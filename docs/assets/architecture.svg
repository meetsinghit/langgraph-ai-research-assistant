<rect x="655" y="494" width="577" height="155" rx="14" fill="#102925" stroke="#3b816b"/><text x="679" y="523" font-size="11" fill="#92ead0" letter-spacing="1.5" font-weight="700">CROSS-CUTTING SAFEGUARDS</text><text x="679" y="558" font-size="23" font-weight="800" fill="#effbf8">Security + evaluation + observability</text><text x="679" y="588" font-size="15" fill="#b6d8cf">SSRF · DLP · allow-listed fetches · citation gates</text><text x="679" y="617" font-size="13" fill="#88b4a5">Metrics without raw page text · offline quality/security suites</text>
