<text x="51" y="58" font-size="27" font-weight="800" fill="#f0f9fd">End-to-end system architecture</text><text x="52" y="84" font-size="15" fill="#84a8b8">Authenticated browser · Bounded research execution · Evidence provenance · Durable history</text>
<g filter="url(#s)">
<rect x="48" y="124" width="247" height="151" rx="15" fill="#152c39" stroke="#2a6777"/><text x="71" y="154" font-size="11" fill="#87e6d2" font-weight="700" letter-spacing="1.5">PRESENTATION</text><text x="71" y="186" font-size="24" font-weight="800" fill="#f4f8fb">React + TypeScript</text><text x="71" y="214" font-size="15" fill="#b0c9d7">Research workspace</text><text x="71" y="239" font-size="13" fill="#87a4b5">History / sources / diagnostics</text>
<rect x="344" y="124" width="262" height="151" rx="15" fill="#152c39" stroke="#2a6777"/><text x="367" y="154" font-size="11" fill="#87e6d2" font-weight="700" letter-spacing="1.5">API &amp; LIFECYCLE</text><text x="367" y="186" font-size="24" font-weight="800" fill="#f4f8fb">FastAPI</text><text x="367" y="214" font-size="15" fill="#b0c9d7">Auth / sessions / RunManager</text><text x="367" y="239" font-size="13" fill="#87a4b5">SSE replay / idempotency / cancel</text>
<rect x="655" y="124" width="577" height="151" rx="15" fill="#152c39" stroke="#2a6777"/><text x="679" y="154" font-size="11" fill="#87e6d2" font-weight="700" letter-spacing="1.5">RESEARCH ORCHESTRATION</text><text x="679" y="186" font-size="24" font-weight="800" fill="#f4f8fb">LangGraph StateGraph</text><text x="679" y="214" font-size="15" fill="#b0c9d7">Deterministic routing · Bounded retries · Quality gates</text><text x="679" y="239" font-size="13" fill="#87a4b5">Frozen per-run model / thinking / depth / evidence settings</text>
</g>
