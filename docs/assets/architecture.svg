<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc">
<title id="title">AI Research Assistant system architecture</title><desc id="desc">The React browser uses Bearer-authenticated FastAPI to manage persistent runs and stream events. A LangGraph research engine plans, searches, retrieves, synthesizes and reviews using Gemini, with security policy boundaries and SQLite data persistence.</desc>
